$font = JetBrainsMono Nerd Font
$bg = ~/.config/hypr/assets/default-02.jpg

general {
    grace = 5
    disable_loading_bar = false
    hide_cursor = false
}


background {
    monitor =
    path = $bg
    blur_passes = 1
    blur_size = 2
    noise = 0.008
    contrast = 1.1
    brightness = 0.92
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------
# Clock
# -----------------------------------------------------

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255,255,255,0.9)
    
    font_size = 95
    font_family = $font
    
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%A, %d %B")"
    color = rgba(255,255,255,0.6)
    
    font_size = 22
    font_family = $font
    
    position = 0, -18
    halign = center
    valign = center
}



    
# -----------------------------------------------------
# Actions
# -----------------------------------------------------



shape {
    size = 160, 58
    color = rgba(18, 35, 30, 0.85)
    rounding = 8
    
    position = 276, 18
    
    halign = center
    valign = bottom
}



# Botão - Suspender a tela
image {
    path = ~/.config/hypr/assets/moon.png
    size = 25

    halign = center
    valign = bottom
    position = 230, 36

    
    border_size	= 0
    onclick = systemctl suspend
}


# Botão - Desligar
image {
    path = ~/.config/hypr/assets/power.png
    size = 25

    halign = center
    valign = bottom
    position = 275, 36

    
    border_size	= 0
    onclick = systemctl poweroff
}



# Botão - Reboot
image {
    path = ~/.config/hypr/assets/rotate-ccw.png
    size = 25

    halign = center
    valign = bottom
    position = 320, 36

    
    border_size	= 0
    onclick = systemctl reboot
}

    
    







# -----------------------------------------------------
# Password Input
# -----------------------------------------------------




input-field {
    size = 360, 58
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true

    fade_on_empty = false
    
    placeholder_text = Digite sua sua senha...
    font_size = 14
    font_family = $font
    

    rounding = 10

    position = 0, 20
    halign = center
    valign = bottom
    

    outer_color = rgba(0,140,125,0)     
    inner_color = rgba(18, 35, 30, 0.85)      
    font_color = rgba(255,255,255,0.9)
    
    check_color = rgba(0,180,150,0.9)
    fail_color  = rgba(220,90,80,0.9)
}




label {
    monitor =
    text = Precione ENTER para desbloquear
    color = rgba(255,255,255,0.5)
    font_size = 14
    font_family = $font

    valign = bottom
    halign = center

    position = 0, 120
}






    
# -----------------------------------------------------
# User info
# -----------------------------------------------------



shape {
    size = 180, 58
    color = rgba(18, 35, 30, 0.9)
    rounding = 8
    
    position = -286, 18
    
    halign = center
    valign = bottom
}



# Botão - Suspender a tela
image {
    path = ~/.config/hypr/assets/user-cog.png
    size = 25

    halign = center
    valign = bottom
    position = -350, 36

    
    border_size	= 0
}


label {
    monitor =
    text = ferreira-gn
    color = rgba(255,255,255,0.9)
    
    font_size = 12
    font_family = $font

    valign = bottom
    halign = center

    position = -270, 38
}


